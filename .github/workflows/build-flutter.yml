name: Build Flutter APK

on:
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and set app name, icon, internet access
        run: |
          flutter create --platforms=android --org com.personal.salads --project-name ladushki_salads _gen
          cp -r _gen/android ./android
          rm -rf _gen
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>|' $MANIFEST
          sed -i 's|android:label="ladushki_salads"|android:label="Ладушки салаты"|' $MANIFEST
          cp -r icons/mipmap-* android/app/src/main/res/
          # плагины требуют compileSdk 36
          sed -i 's/flutter\.compileSdkVersion/36/g' android/app/build.gradle* || true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ladushki-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
